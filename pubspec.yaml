name: expense_tracker
description: "Трекер расходов - учёт личных и служебных расходов для ОС Аврора"
organization: "ru.grigorev"
license: "BSD-3-Clause"
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  
  # Состояние и DI. Чистый Dart — берём с pub.dev как есть
  flutter_riverpod: ^3.3.2

  # Аврора-виджеты (AuroraApp, AuroraAppBar, AuroraPageRoute).
  # Поставляется в составе Flutter SDK Авроры — git-зависимость не нужна.
  aurora_controls: ^1.0.0
  
  sqlite3: ^2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
