name: tracker_1
description: "Трекер расходов - учёт личных и служебных расходов для ОС Аврора"
organization: "ru.volgait"
license: "BSD-3-Clause"
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  
  # Состояние и DI. flutter_riverpod — для виджетов (ProviderScope,
  # Consumer*), riverpod — ядро на чистом Dart: провайдеры lib/state/
  # не зависят от Flutter, поэтому tool/check_providers.dart гоняет
  # их на хосте без эмулятора.
  flutter_riverpod: ^3.3.2
  riverpod: ^3.3.2

  # Аврора-виджеты (AuroraApp, AuroraAppBar, AuroraPageRoute).
  # Поставляется в составе Flutter SDK Авроры — git-зависимость не нужна.
  aurora_controls: ^1.0.0
  
  sqlite3: ^2.9.4

  # Поделиться отчётом: интерфейс share_plus
  share_plus: ^12.0.2

  # SHA-256 для хэша пин-кода. Pure-Dart
  crypto: ^3.0.8

  archive: ^3.6.1

  dbus: ^0.7.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  share_plus:
    hosted:
      url: https://sdk-repo.omprussia.ru/sdk/flutter/pub
      name: share_plus
