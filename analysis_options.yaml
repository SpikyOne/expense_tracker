# Статический анализатор Dart.
# Требование ТЗ: `dart-aurora analyze` должен проходить без замечаний.

include: package:flutter_lints/flutter.yaml

# Ширина строки = 120 — согласована с `dart-aurora format --line-length=120 .`
# Благодаря этому блоку сам форматер можно дальше вызывать без флага.
formatter:
  page_width: 120

analyzer:
  exclude:
    # Генерируемый код (drift -> *.g.dart, freezed -> *.freezed.dart).
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Единый стиль: строки в одинарных кавычках.
    prefer_single_quotes: true

    # Каждый метод явно объявляет возвращаемый тип.
    always_declare_return_types: true
